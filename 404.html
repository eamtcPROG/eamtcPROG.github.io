<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Mihai Corețchi</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <main class="hero wrap" style="grid-template-columns: 1fr; min-height: 80vh;">
    <div class="hero-text">
      <p class="eyebrow">404</p>
      <h1>Nothing here.</h1>
      <p class="lead">That page doesn't exist, or it moved.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to the homepage</a>
      </div>
    </div>
  </main>
</body>
</html>
